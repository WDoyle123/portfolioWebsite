apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-website-deployment
  namespace: portfolio-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-website
  template:
    metadata:
      labels:
        app: portfolio-website
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - name: portfolio-website
        image: ${PORTFOLIO_IMAGE_REF}
        imagePullPolicy: Always
        ports:
        - containerPort: 80
